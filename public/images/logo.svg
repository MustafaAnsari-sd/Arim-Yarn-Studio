<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <!-- Background transparent -->
  <rect width="400" height="200" fill="none"/>

  <!-- Yarn ball above the 'i' -->
  <circle cx="213" cy="28" r="16" fill="#D4A0A0"/>
  <path d="M199 28 Q213 18 227 28" stroke="#5C4033" stroke-width="1.8" fill="none"/>
  <path d="M197 32 Q213 22 229 32" stroke="#5C4033" stroke-width="1.8" fill="none"/>
  <path d="M199 36 Q213 26 227 36" stroke="#5C4033" stroke-width="1.8" fill="none"/>

  <!-- Crochet hook through the 'i' -->
  <line x1="213" y1="46" x2="213" y2="105" stroke="#5C4033" stroke-width="3" stroke-linecap="round"/>
  <path d="M213 105 Q213 118 203 118 Q193 118 193 108" stroke="#5C4033" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- ARIM text -->
  <text x="200" y="130" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="80" font-weight="700" fill="#5C4033" letter-spacing="-2">Arim</text>

  <!-- Decorative swash line below -->
  <path d="M80 148 Q160 135 240 148 Q300 158 340 145" stroke="#D4A0A0" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Curl at end -->
  <path d="M340 145 Q355 140 358 152 Q361 164 348 165" stroke="#D4A0A0" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- YARN STUDIO text -->
  <text x="200" y="185" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="400" fill="#5C4033" letter-spacing="8">YARN STUDIO</text>
</svg>
